  </defs>

  <image href="/images/logo1.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet" />

  <text x="560" y="332"
        font-family="Figtree, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="220"
        font-weight="800"
        fill="url(#brandGradient)">
